    <script>
      // Já entrou na conta? Na landing ("/"), vai direto para o jogo antes de mostrar a página.
      (function () {
        if (location.pathname !== '/') return;
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i) || '';
            if (k === 'minecraft_edu_auth' || /^sb-.+-auth-token$/.test(k)) return location.replace('/inicio');
          }
        } catch (e) {}
      })();
    </script>
